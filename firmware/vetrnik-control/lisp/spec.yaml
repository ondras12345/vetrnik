# vim: tabstop=2 softtabstop=2 shiftwidth=2 expandtab

# This file contains the specification for custom LISP / fe functions.
# It is edited manually and used to generate documentation (and in the future,
# hopefully also tests).

categories:
  LCD: functions that control the display
  callbacks: functions to be implemented by the user to respond to various events

functions:

  - name: rem
    description: |-
      Remainder function.

      Performs the operation truncate on number and divisor and returns the
      remainder of the truncate operation.

      https://stackoverflow.com/questions/5706398/how-to-get-the-modulus-in-lisp
    example: |-
      (rem 3 2) ; 1
      (rem -3 2) ; -1
    nargs: 2
    args:
      - name: x
        type: number
      - name: y
        type: number
    return:
      type: number
      description: '`(int)x % (int)y`'
    tests:
      - '(is (rem 3 2) 1)'
      - '(is (rem -3 2) -1)'

  - name: round
    description: >-
      Return the closest integer to x,
      rounding to even when x is halfway between two integers.
    example: |-
      (round 0.4999) ; 0
      (round 0.5) ; 0
      (round 0.5001) ; 1

      (round 1.4999) ; 1
      (round 1.5) ; 2
      (round 1.5001) ; 2
    nargs: 1
    args:
      - name: x
        type: number
        description: number to round
    return:
      type: number
    tests:
      - '(is (round 0.4999) 0)'
      - '(is (round 0.5) 0)'
      - '(is (round 0.5001) 1)'
      - '(is (round 1.4999) 1)'
      - '(is (round 1.5) 2)'
      - '(is (round 1.6001) 2)'

  - name: map
    description: |-
      [Arduino-like
      map](https://docs.arduino.cc/language-reference/en/functions/math/map/)
      function, but isn't as broken (uses floating point
      arithmetic).

      This could be easily implemented in Lisp, but a cfunc takes up less memory.
      Equivalent lisp implementation:
      ```lisp
      (= map (fn (v fl fh tl th)
        (+ tl
          (/ (* (- v fl) (- th tl)) (- fh fl))
        )
      ))
      ```
    example: |-
      (map 10 0 100 0 1) ; 0.1
      (map 10 0 100 -1 0) ; -0.9
    nargs: 5
    args:
      - name: value
        type: number
        description: the number to map
      - name: from_low
        type: number
        description: lower bound of `value`'s current range
      - name: from_high
        type: number
        description: upper bound of `value`'s current range
      - name: to_low
        type: number
        description: lower bound of `value`'s target range
      - name: to_high
        type: number
        description: upper bound of `value`'s target range
    return:
      type: number
      description: '`value` remapped to the target range'
    tests:
      - '(is (map 10 0 100 -1 0) -0.9)'
      - '(is (map 10 0 100 0 1) 0.1)'
      - '(is (map 10 0 1 0 -2) -20)'

  - name: lim
    description: |-
      Limit a number to a range.

      Equivalent lisp implementation:
      ```lisp
      (= lim (fn (x l h)
        (if
          (< x l) l
          (< h x) h
          x
        )
      ))
      ```
    nargs: 3
    args:
      - name: x
        type: number
        description: value to be processed
      - name: low
        type: number
        description: lower bound for the value's range
      - name: high
        type: number
        description: upper bound for the value's range
    return:
      type: number
    tests:
      - '(is (lim 10 0 10) 10)'
      - '(is (lim -10 0 10) 0)'
      - '(is (lim 11 0 10) 10)'
      - '(is (lim 2 -10 10) 2)'

  - name: pwrg
    description: >-
      Get a value from the power board state object.
      Numerical values (in SI units without metric prefix) are returned.
    nargs:
      min: 1
      max: 2
    args:
      - name: name
        type: string
        values:
          - '"valid"'
          - '"time"'
          - '"mode"'
          - '"duty"'
          - '"OCP_max_duty"'
          - '"RPM"'
          - '"voltage"'
          - '"current"'
          - '"hw_enable"'
          - '"sw_enable"'
          - '"enabled"'
          - '"emergency"'
            # TODO '"REL"' would break tests
      - name: relay_nr
        type: number
        description: 'relay number (starting from 1); only used if name == "REL"'
    return:
      type: any
    tests:
      - <<: &first-arg-values
          template: |-
            ; for all values of first argument, results are returned and aren't pairs
            (and
            {%- for v in this.args[0].values %}
              (atom ({{this.name}} {{v}}))
            {%- endfor %}
            )
      - '(atom (pwrg "REL" 1))'

  - name: pwrs
    description: >-
      Set parameters on the power board.
      Variables are added for the constants from `power_board_mode_t` enum.
      They are prefixed with `pwr_`, e.g. `pwr_start`.
    nargs:
      min: 2
    args:
      - name: name
        type: string
        values:
          - '"duty"'
          - '"mode"'
          - '"REL"'
          - '"sw_enable"'
      - name: value
        description: Desired value (expected type depends on 'name')
    return: nil
    tests:
      - '(do (pwrs "sw_enable" t) (pwrg "sw_enable"))'
      - '(do (pwrs "sw_enable" nil) (not (pwrg "sw_enable")))'
      - |-
        ; verify that all power board modes are supported
        (do
          (= pwr_modes (list pwr_emergency pwr_stopping pwr_const_duty pwr_start))
          (while pwr_modes
            (pwrs "mode" (car pwr_modes))
            (= pwr_modes (cdr pwr_modes))
          )
          t
        )

  - name: lcdc
    description: Set LCD cursor position to specified column.
    category: LCD
    nargs: 1
    args:
      - name: column
        type: number
    return: nil

  - name: lcdw
    description: Write LCD buffer to specified line (row).
    category: LCD
    nargs: 1
    args:
      - name: row
        type: number
    return: nil

  - name: lcds
    description: Print a string to the LCD buffer.
    category: LCD
    nargs: 1
    args:
      - name: str
        type: string
    return: nil

  - name: lcdn
    description: Print a number to the LCD buffer.
    category: LCD
    nargs: 3
    args:
      - name: number
        description: number to print
        type: number
      - name: align
        description: (integer) TODO
        type: number
      - name: precision
        description: (integer) number of decimal places (TODO verify)
    return: nil


  - name: lcdb
    description: Get or set LCD backlight status.
    category: LCD
    nargs:
      max: 1
    args:
      - name: state
        type: bool
        description: Desired backlight status
    return:
      type: bool
      description: LCD backlight status
    tests:
      - '(and (lcdb t) (lcdb))'
      - '(and (not (lcdb nil)) (not (lcdb)))'

  - name: stats
    description: Get a value from the stats struct.
    nargs: 1
    args:
      - name: name
        type: string
        values:
          - '"energy"'
    return:
      type: number
      description: value
    tests:
      - *first-arg-values
      - '(<= 0 (stats "energy"))'

  - name: ctrlg
    description: Get a value from the control subsystem.
    nargs: 1
    args:
      - name: name
        type: string
        values:
          - '"strategy"'
          - '"contactor"'
          - '"vwind"'
    return:
      type: any
    tests:
      - *first-arg-values

  - name: ctrls
    description: Set a value in the control subsystem.
    nargs: 2
    args:
      - name: name
        type: string
        values:
          - '"strategy"'
          - '"contactor"'
      - name: value
        description: Desired value (expected type depends on 'name')
    return: nil

  - name: out
    description: |-
      Get or set state of digital outputs (LEDs and relays) on the control board.
    nargs:
      min: 1
      max: 2
    args:
      - name: out_number
        type: string
        values:
          - '"LED_BLUE"'  # LED_BUILTIN
          - '"LED_RED"'
          - '"PUMP"'  # REL1: circulation pump
          - '"REL2"'
      - name: state
        type: bool
        description: desired state
    return:
      type: bool
      description: state of the digital output
    tests:
      - template: |-
          ; all outputs can be toggled
          (and
          {%- for o in this.args[0].values %}
            (and ({{this.name}} {{o}} t) ({{this.name}} {{o}}))
            (and (not ({{this.name}} {{o}} nil)) (not ({{this.name}} {{o}})))
          {%- endfor %}
          )

  - name: ds18
    description: Read temperature from DS18B20 sensors.
    nargs: 1
    args:
      - name: sensor_number
        type: number
    return:
      type: number
      description: temperature in degrees C. nil is returned if sensor is broken.

  - name: ctrl
    category: callbacks
    description: |-
      If set up for `LISP` control strategy, the device will call this function
      each time a new state object is received.

      The `ctrl` function is empty by default, the user is expected to
      overwrite this function with their own implementation.
    example: |-
      A simple "blink" control function:
      ```lisp
      (= dl 50) ; off state duty
      (= dh 200) ; on state duty
      (= p 5) ; period in seconds
      (= pt 0) ; prev time
      (= ctrl (fn ()
        ; t is used for "true", do not overwrite - named ti instead
        (let ti (pwrg "time"))
        ; max time is 65535 (see power report()), so no problem with rem
        (if (and (is (rem ti p) 0) (not (is ti pt)))
          (do
            (= pt ti)
            (pwrs "duty" (if (<= (pwrg "duty") dl) dh dl))
          )
        )
      ))
      ```

      Simple RPM threshold-based control:
      ```lisp
      (= ctrl (fn ()
        (let r (pwrg "RPM")) ; current RPM
        (pwrs "duty"
          (if
            ; pretty much random values
            (< r 10) 0
            (< r 15) 10
            (< r 20) 20
            (< r 30) 40
            (< r 60) 100
            255
          )
        )
      ))
      ```
    nargs: 0
    args: []
    return: nil

  - name: disp
    category: callbacks
    description: |-
      The `disp` function is executed every 0.5 s. It is meant to be used to
      control the display.

      The `disp` function is empty by default, the user is expected to
      overwrite this function with their own implementation.
    nargs: 0
    args: []
    return: nil

  - name: btn1_short
    <<: &btn_handlers
      category: callbacks
      description: >-
        The functions `btn1_short`, `btn1_long`, `btn2_short`, and `btn2_long`
        are called when the respective button is short / long pressed. (To be
        more precise, they are only called once the button is released.)
      nargs: 0
      args: []
      return: nil
  - name: btn1_long
    <<: *btn_handlers
  - name: btn2_short
    <<: *btn_handlers
  - name: btn2_long
    <<: *btn_handlers
